<div class="launchpad">
  <div class="eyebrow">{{ page.eyebrow }}</div>
  <h1>{{ page.title }}</h1>
  <p class="launch-intro">{{ page.intro }}</p>
  <div class="row g-3 g-md-4">
    {% for card in page.cards %}
      <div class="col-md-4">
        <a class="card launch-card" href="{{ card.href }}">
          {% if card.eyebrow %}
            <div class="eyebrow mb-2">{{ card.eyebrow }}</div>
          {% endif %}
          <h2>{{ card.title }}</h2>
          <p>{{ card.description }}</p>
          {% if card.status_label %}
            <div class="mt-3">
              <span class="status status-{{ card.status_role }}">{{ card.status_label }}</span>
            </div>
          {% endif %}
        </a>
      </div>
    {% endfor %}
  </div>
</div>
