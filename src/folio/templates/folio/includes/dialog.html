<dialog class="sk-dialog" id="{{ dialog.id }}" aria-labelledby="{{ dialog.id }}-title">
  <div class="d-flex justify-content-between align-items-start gap-3">
    <h2 id="{{ dialog.id }}-title">{{ dialog.title }}</h2>
    <form method="dialog">
      <button class="btn btn-sm btn-outline-secondary" aria-label="Close {{ dialog.title }}" autofocus>Close</button>
    </form>
  </div>
  {% include dialog.template_name %}
</dialog>
