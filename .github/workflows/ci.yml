name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q
