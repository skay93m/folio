[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.2.0"
description = "SK Design System Django 6 UI engine, typed pattern contracts, source-linked catalogue, and static release bundler."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
]

[dependency-groups]
dev = [
    "playwright>=1.50.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-playwright>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

[tool.hatch.build.targets.sdist]
include = [
    "src/folio",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
DJANGO_SETTINGS_MODULE = "folio_site.settings"
addopts = "--tb=short"
